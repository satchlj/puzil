[package]
name = "puzil-zulip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "form", "query", "multipart"] }
url = "2.5"
getrandom = "0.4"
keyring-core = "1.1"
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
