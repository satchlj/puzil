[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.10.0", default-features = false, features = ["component", "assets"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# What ships (tools/macos/bundle.sh, tools/linux/appimage.sh) and what the benchmarks measure:
# whole-program optimization, ~25% less frame work than `release` and a smaller binary, at
# about 3 minutes per build. `release` stays quick for development.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# GPUI's macOS renderer and platform, patched (see vendor/*/PUZIL.md).
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
